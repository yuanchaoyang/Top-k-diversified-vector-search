<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diversified Passage Search - Multi-Source Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.8em;
        }
        .subtitle {
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 16px;
            font-size: 1em;
        }
        .search-box {
            background: white;
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            border: none;
            font-size: 18px;
            padding: 10px;
            outline: none;
        }
        .search-box button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .search-box button:hover {
            transform: scale(1.05);
        }
        .examples {
            text-align: center;
            margin-bottom: 20px;
        }
        .examples span {
            color: rgba(255,255,255,0.7);
            margin-right: 10px;
        }
        .examples a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 15px;
            margin: 4px;
            display: inline-block;
            transition: background 0.2s;
            font-size: 14px;
        }
        .examples a:hover {
            background: rgba(255,255,255,0.3);
        }
        .results-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .result-card {
            background: white;
            border-radius: 15px;
            padding: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            min-width: 0;
            overflow: hidden;
        }
        .result-card h3 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .method-tag {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 10px;
            color: white;
        }
        .method-intent { background: #667eea; }
        .method-low { background: #48bb78; }
        .method-high { background: #ed8936; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .metric {
            text-align: center;
            padding: 8px 4px;
            background: #f7fafc;
            border-radius: 10px;
        }
        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        .metric-label {
            font-size: 11px;
            color: #718096;
        }
        .lambda-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin: 10px 0;
            position: relative;
        }
        .lambda-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #48bb78, #ed8936);
            transition: width 0.3s;
        }
        .lambda-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #718096;
        }
        .result-list {
            list-style: none;
        }
        .result-item {
            padding: 10px 8px;
            border-bottom: 1px solid #edf2f7;
            cursor: pointer;
            transition: background 0.15s;
        }
        .result-item:hover {
            background: #f0f4ff;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }
        .result-rank {
            color: #718096;
            font-size: 12px;
            flex-shrink: 0;
        }
        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a0dab;
            line-height: 1.3;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-score-badge {
            font-size: 11px;
            color: #718096;
            background: #f7fafc;
            padding: 2px 8px;
            border-radius: 8px;
            flex-shrink: 0;
            font-weight: 500;
        }
        .result-snippet {
            font-size: 12px;
            line-height: 1.4;
            color: #4d5156;
            margin-left: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .source-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .source-wiki {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .source-web {
            background: #f3f4f6;
            color: #6b7280;
        }
        .intent-info {
            background: #f0f4ff;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .intent-info h4 {
            color: #667eea;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .intent-info p {
            color: #4a5568;
            font-size: 13px;
        }
        /* Modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .modal-header h3 {
            color: #1a0dab;
            font-size: 16px;
            line-height: 1.4;
            flex: 1;
        }
        .modal-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #718096;
            padding: 0 4px;
            line-height: 1;
        }
        .modal-close:hover {
            color: #333;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.7;
            color: #2d3748;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .loading {
            text-align: center;
            color: white;
            padding: 50px;
            font-size: 18px;
        }
        @media (max-width: 1200px) {
            .results-container {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 800px) {
            .results-container {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.6em; }
            .examples a { font-size: 12px; padding: 4px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diversified Passage Search</h1>
        <p class="subtitle">Multi-Source Diversified Retrieval</p>

        <div class="search-box">
            <input type="text" id="query" placeholder="Enter a search query..." onkeypress="if(event.key==='Enter')search()">
            <button onclick="search()">Search</button>
        </div>

        <div class="examples">
            <span>Try:</span>
            <a href="#" onclick="searchExample('apple')">apple</a>
            <a href="#" onclick="searchExample('mercury')">mercury</a>
            <a href="#" onclick="searchExample('python')">python</a>
            <a href="#" onclick="searchExample('jaguar')">jaguar</a>
            <a href="#" onclick="searchExample('how does photosynthesis work')">how does photosynthesis work</a>
            <a href="#" onclick="searchExample('what is the meaning of life')">what is the meaning of life</a>
            <a href="#" onclick="searchExample('who wrote romeo and juliet')">who wrote romeo and juliet</a>
            <a href="#" onclick="searchExample('best ways to improve health')">best ways to improve health</a>
        </div>

        <div id="results"></div>
    </div>

    <!-- Full passage modal -->
    <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <div class="modal-meta">
                    <span id="modal-source" class="source-badge"></span>
                    <span id="modal-score" class="result-score-badge"></span>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        function searchExample(q) {
            document.getElementById('query').value = q;
            search();
            return false;
        }

        async function search() {
            const query = document.getElementById('query').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const response = await fetch(`/api/compare?q=${encodeURIComponent(query)}&k=10`);
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
            }
        }

        // Store all results for click-to-expand (avoids inline JSON escaping issues)
        let _allResults = {};

        function displayResults(data) {
            _allResults = data;
            const resultsDiv = document.getElementById('results');

            const methods = [
                { key: 'intent_adaptive', name: 'Intent-Adaptive', class: 'method-intent' },
                { key: 'fixed_low', name: 'Fixed \u03bb=0.5', class: 'method-low' },
                { key: 'fixed_high', name: 'Fixed \u03bb=0.8', class: 'method-high' }
            ];

            let html = '<div class="results-container">';

            for (const method of methods) {
                const result = data[method.key];
                const lambdaPercent = ((result.lambda_value - 0.2) / 0.8) * 100;

                html += `
                    <div class="result-card">
                        <h3>
                            ${method.name}
                            <span class="method-tag ${method.class}">\u03bb=${result.lambda_value.toFixed(2)}</span>
                        </h3>

                        ${method.key === 'intent_adaptive' ? `
                        <div class="intent-info">
                            <h4>Intent Analysis</h4>
                            <p>Query clarity: <strong>${(result.intent_score * 100).toFixed(0)}%</strong></p>
                            <p>${result.intent_score < 0.3 ? 'Ambiguous query \u2192 more diversity' :
                               result.intent_score > 0.7 ? 'Specific query \u2192 more relevance' :
                               'Moderate query \u2192 balanced approach'}</p>
                        </div>
                        ` : ''}

                        <div class="lambda-bar">
                            <div class="lambda-fill" style="width: ${Math.min(100, Math.max(0, lambdaPercent))}%"></div>
                        </div>
                        <div class="lambda-info">
                            <span>\u2190 Diversity</span>
                            <span>Relevance \u2192</span>
                        </div>

                        <div class="metrics">
                            <div class="metric">
                                <div class="metric-value">${(result.relevance * 100).toFixed(1)}</div>
                                <div class="metric-label">Relevance</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${(result.diversity * 100).toFixed(1)}</div>
                                <div class="metric-label">Diversity</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${(result.f1 * 100).toFixed(1)}</div>
                                <div class="metric-label">F1</div>
                            </div>
                        </div>

                        <ul class="result-list">
                            ${result.results.map((r, i) => `
                                <li class="result-item" data-method="${method.key}" data-index="${i}">
                                    <div class="result-header">
                                        <span class="result-rank">${r.rank}.</span>
                                        ${r.source === 'wiki'
                                            ? '<span class="source-badge source-wiki">Wiki</span>'
                                            : '<span class="source-badge source-web">Web</span>'}
                                        <span class="result-title">${r.title}</span>
                                        <span class="result-score-badge">${(r.score * 100).toFixed(1)}%</span>
                                    </div>
                                    <div class="result-snippet">${r.snippet}</div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            html += '</div>';
            resultsDiv.innerHTML = html;
        }

        // Event delegation: handle clicks on any result item
        document.addEventListener('click', function(e) {
            const item = e.target.closest('.result-item');
            if (!item) return;
            const methodKey = item.dataset.method;
            const index = parseInt(item.dataset.index);
            if (methodKey && _allResults[methodKey]) {
                openModal(_allResults[methodKey].results[index]);
            }
        });

        function openModal(r) {
            // Extract full first sentence from passage as title (backend truncates to 80 chars)
            const sentenceMatch = r.passage.match(/^(.*?[.?!])\s/);
            const fullTitle = sentenceMatch ? sentenceMatch[1] : r.passage.substring(0, 200);
            document.getElementById('modal-title').textContent = fullTitle;
            document.getElementById('modal-body').textContent = r.passage;
            document.getElementById('modal-score').textContent = (r.score * 100).toFixed(1) + '%';
            const srcEl = document.getElementById('modal-source');
            if (r.source === 'wiki') {
                srcEl.textContent = 'Wiki';
                srcEl.className = 'source-badge source-wiki';
            } else {
                srcEl.textContent = 'Web';
                srcEl.className = 'source-badge source-web';
            }
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
